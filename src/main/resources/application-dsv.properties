# Perfil de desenvolvimento local (DSV): rode com -Dspring.profiles.active=dsv
# Usa H2 em memoria. Nenhum segredo real deve ser colocado aqui.
spring.datasource.url=jdbc:h2:mem:apidsv
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2 (somente DSV)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JWT (valor de desenvolvimento, nunca use em producao)
api.security.token.secret=dev-only-secret-change-me-0123456789abcdef

# Admin de desenvolvimento
app.admin.login=admin
app.admin.password=Dev@dmin12345

# Reset de senha e e-mail (nao envia e-mail de verdade)
vavahelper.urlresetpass=http://localhost:3000
spring.mail.username=dev
spring.mail.password=dev

# Swagger ligado em DSV
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.swagger.enabled=true

server.forward-headers-strategy=none
