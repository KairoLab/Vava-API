spring.application.name=vavahelper

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
# "native" faz o Tomcat ler X-Forwarded-For apenas de proxies internos (rede privada),
# para o rate limit enxergar o IP real do cliente. Use "none" se a API nao estiver atras de proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
server.tomcat.max-http-form-post-size=64KB
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}

# ---------------------------------------------------------------------------
# Banco de dados
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
# Em producao prefira "validate" ou "none" e migre o schema com Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT (JWT_SECRET e obrigatorio e precisa ter pelo menos 32 caracteres)
# ---------------------------------------------------------------------------
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------------------------------------------------------------------------
# Admin inicial (opcional). Sem ADMIN_PASSWORD nenhum admin e criado.
# ---------------------------------------------------------------------------
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Reset de senha
# ---------------------------------------------------------------------------
vavahelper.urlresetpass=${URL_RESET_PASS}
vavahelper.password-reset.token-expiration=${TOKEN_EXPIRATION:5}

# ---------------------------------------------------------------------------
# E-mail (credenciais SEMPRE via variavel de ambiente)
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# CORS: lista de origens separadas por virgula (ex: https://meusite.com,https://www.meusite.com)
# O padrao "*" libera qualquer origem. Em producao informe o dominio do frontend.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---------------------------------------------------------------------------
# Cache (Caffeine) e cache HTTP
# ---------------------------------------------------------------------------
spring.cache.type=caffeine
spring.cache.cache-names=agents,skills,lineups
spring.cache.caffeine.spec=${CACHE_SPEC:maximumSize=50,expireAfterWrite=1h}
app.http-cache.max-age-seconds=${HTTP_CACHE_MAX_AGE:300}

# ---------------------------------------------------------------------------
# Rate limit por IP (token bucket em memoria). Valores: capacidade e janela em segundos.
# ---------------------------------------------------------------------------
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.global.capacity=${RATE_LIMIT_GLOBAL:120}
app.rate-limit.global.window-seconds=60
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN:10}
app.rate-limit.login.window-seconds=60
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER:10}
app.rate-limit.register.window-seconds=3600
app.rate-limit.recovery.capacity=${RATE_LIMIT_RECOVERY:5}
app.rate-limit.recovery.window-seconds=900

# ---------------------------------------------------------------------------
# Actuator: somente /actuator/health, sem detalhes
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Swagger / OpenAPI: desligado por padrao. Use SWAGGER_ENABLED=true para ligar.
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
app.swagger.enabled=${SWAGGER_ENABLED:false}
