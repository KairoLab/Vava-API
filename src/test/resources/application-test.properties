# Perfil usado pelos testes: H2 em memoria e valores fixos (nenhum segredo real).
spring.datasource.url=jdbc:h2:mem:apitest;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

api.security.token.secret=test-secret-with-more-than-32-characters-123456
app.admin.password=
vavahelper.urlresetpass=http://localhost:3000
spring.mail.username=test
spring.mail.password=test
app.cors.allowed-origins=http://localhost:3000
server.forward-headers-strategy=none
